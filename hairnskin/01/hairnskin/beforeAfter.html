<!DOCTYPE html>
<html lang="English">

<head id="head"></head>

<body id="top">
    <div class="loader-wrapper img-gif">
        <img src="images/loader.gif" alt="">
    </div>
    <div class="pageWrap">

        <!-- header -->
        <header id="header"></header>
        <!-- Slider Start -->
        <div class="container">

            <section class="page-title bg-cont">
                <div class="row">
                    <div class="col-md-12 pageBnr">
                        <span class="hangBnr-img">
                            <img src="images/illustrator-13.png" />
                        </span>
                        <span class="hangBnr-img-right">
                            <img src="images/illustrator-14.png" />
                        </span>
                        <div class="block text-center">
                            <h1 class="text-capitalize text-lg">Before & After</h1>
                        </div>
                    </div>
            </section>
        </div>
        <section class="section bfaHdr">
            <div class="container">
                <div id="comparison">
                    <figure>
                        <div id="divisor"></div>
                    </figure>
                    <input type="range" min="0" max="100" value="50" id="slider" oninput="moveDivisor()">
                </div>
            </div>
        </section>
        <!-- footer Start -->
        <footer id="footer" class="footer section">
        </footer>
    </div>
    <!--     Essential Scripts
    =====================================-->


    <!-- Main jQuery -->
    <script src="plugins/jquery/jquery.js"></script>
    <!-- Bootstrap 4.3.2 -->
    <script src="plugins/bootstrap/js/popper.js"></script>
    <script src="plugins/bootstrap/js/bootstrap.min.js"></script>
    <script src="plugins/counterup/jquery.easing.js"></script>
    <!-- Slick Slider -->
    <script src="plugins/slick-carousel/slick/slick.min.js"></script>
    <!-- Counterup -->
    <script src="plugins/counterup/jquery.waypoints.min.js"></script>

    <script src="plugins/shuffle/shuffle.min.js"></script>
    <script src="plugins/counterup/jquery.counterup.min.js"></script>
    <!-- Google Map -->
    <script src="plugins/google-map/map.js"></script>
    <script
        src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAkeLMlsiwzp6b3Gnaxd86lvakimwGA6UA&callback=initMap"></script>

    <script src="js/script.js"></script>
    <script src="js/contact.js"></script>
    <script src="js/main.js"></script>
    <script>
        var divisor = document.getElementById("divisor"),
            slider = document.getElementById("slider");
        function moveDivisor() {
            divisor.style.width = slider.value + "%";
        }
    </script>

</body>

</html>
